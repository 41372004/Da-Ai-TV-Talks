<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人文講堂</title>

    <!-- Bootstrap 4.6 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>

    

</head>

<style>
    body {
        background: #f8f9fa;
    }

    /* Carousel */
    .carousel-item img {
        height: 600px;
        object-fit: cover;
        object-position: center 100%;
    }

    /* 按鈕區 */
    

    /* Card */
    .card {
        transition: .3s;
        border-radius: 15px;
    }

    .card:hover {
        transform: translateY(-8px);
        box-shadow: 0 10px 20px rgba(0,0,0,.25);
    }

    .card-img-top {
        width: 150px;
        height: 150px;
        object-fit: contain;
        margin: 20px auto 0;
    }

    .box{
        margin-bottom:30px;
    }
    #carouselExample{
        position: relative;
    }
    .button-area {
        margin: 25px 0 40px;
        text-align: center;
    }   
</style>

<script>
    function enter() {
        location.href = "achievements.html";
    }
    function person() {
        location.href = "person.html";
    }
</script>

<body>

    <!-- Carousel -->
    <div id="carouselExample" class="carousel slide" data-ride="carousel">

        <!-- 小圓點 -->
        <ol class="carousel-indicators">
            <li data-target="#carouselExample" data-slide-to="0" class="active"></li>
            <li data-target="#carouselExample" data-slide-to="1"></li>
            <li data-target="#carouselExample" data-slide-to="2"></li>
        </ol>

        <div class="carousel-inner">

            <div class="carousel-item active">
                <img src="./images/人文講堂封面.png" class="d-block w-100" alt="封面">
            </div>

            <div class="carousel-item">
                <img src="./images/橫幅1.png" class="d-block w-100" alt="Banner2">
            </div>

            <div class="carousel-item">
                <img src="./images/橫幅2.png" class="d-block w-100" alt="Banner3">
            </div>

        </div>

        <!-- 左右按鈕 -->
        <a class="carousel-control-prev"
           href="#carouselExample"
           role="button"
           data-slide="prev">

            <span class="carousel-control-prev-icon"></span>
            <span class="sr-only">Previous</span>

        </a>

        <a class="carousel-control-next"
           href="#carouselExample"
           role="button"
           data-slide="next">

            <span class="carousel-control-next-icon"></span>
            <span class="sr-only">Next</span>

        </a>

    </div>

    <!-- 功能按鈕 -->
    <div class="button-area">

        <button class="btn btn-outline-dark btn-lg" onclick="person()">
            人文講堂夥伴
        </button>

        <button class="btn btn-outline-dark btn-lg" onclick="enter()">
            實習生作品集
        </button>

        

    </div>

    <!-- 社群 -->
    <div class="container">

        <div class="row">

            <div class="col-md-4">

                <div class="box">

                    <div class="card">

                        <img src="./images/youtube.png" class="card-img-top">

                        <div class="card-body text-center">

                            <a href="https://www.youtube.com/@daaitvtalks"
                                target="_blank"
                                rel="noopener"
                                class="btn btn-danger">

                                前往 YouTube

                            </a>

                        </div>

                    </div>

                </div>

            </div>

            <div class="col-md-4">

                <div class="box">

                    <div class="card">

                        <img src="./images/instagram.png" class="card-img-top">

                        <div class="card-body text-center">

                            <a href="https://www.instagram.com/daaitv.talks/"
                                target="_blank"
                                rel="noopener"
                                class="btn btn-warning">

                                前往 Instagram

                            </a>

                        </div>

                    </div>

                </div>

            </div>

            <div class="col-md-4">

                <div class="box">

                    <div class="card">

                        <img src="./images/communication.png" class="card-img-top">

                        <div class="card-body text-center">

                            <a href="https://www.facebook.com/daaitv.talks/"
                                target="_blank"
                                rel="noopener"
                                class="btn btn-primary">

                                前往 Facebook

                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

        <!-- 第二排 -->

        <div class="row">

            <div class="col-md-6">

                <div class="box">

                    <div class="card">

                        <img src="./images/獨立評論.jpg" class="card-img-top">

                        <div class="card-body text-center">

                            <a href="https://opinion.cw.com.tw/search/doSearch?keyword=%E4%BA%BA%E6%96%87%E8%AC%9B%E5%A0%82&sort=desc"
                                target="_blank"
                                rel="noopener"
                                class="btn btn-info">

                                前往 獨立評論

                            </a>

                        </div>

                    </div>

                </div>

            </div>

            <div class="col-md-6">

                <div class="box">

                    <div class="card">

                        <img src="./images/大愛電視.jpg" class="card-img-top">

                        <div class="card-body text-center">

                            <a href="https://www.daai.tv/program/P1273"
                                target="_blank"
                                rel="noopener"
                                class="btn btn-success">

                                前往 大愛電視節目總覽

                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
